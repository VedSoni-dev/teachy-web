<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teachy Whiteboard — sketch, plan, learn</title>
  <meta name="description" content="A free interactive whiteboard for learning. Draw, write, and plan ideas visually with Teachy." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --wb-bg: #1a1a2e;
      --wb-surface: #16213e;
      --wb-accent: #3380ff;
      --wb-accent-soft: rgba(51, 128, 255, 0.15);
      --wb-ink: #e8e8e8;
      --wb-ink-soft: #8892a4;
      --wb-grid: rgba(255, 255, 255, 0.04);
      --wb-grid-strong: rgba(255, 255, 255, 0.08);
      --wb-danger: #ff6b6b;
      --wb-success: #51cf66;
      --wb-warning: #ffd43b;
      --wb-radius: 12px;
    }

    body {
      margin: 0;
      background: var(--wb-bg);
      color: var(--wb-ink);
      font-family: var(--font);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .wb-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--wb-surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 100;
      gap: 16px;
    }

    .wb-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wb-brand-icon {
      width: 28px;
      height: 28px;
      background: var(--wb-accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
    }

    .wb-brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .wb-brand-sub {
      font-size: 11px;
      color: var(--wb-ink-soft);
    }

    /* Toolbar */
    .wb-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: var(--wb-radius);
    }

    .wb-tool {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--wb-ink-soft);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.15s ease;
    }

    .wb-tool:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--wb-ink);
    }

    .wb-tool.active {
      background: var(--wb-accent-soft);
      color: var(--wb-accent);
    }

    .wb-separator {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 4px;
    }

    /* Color palette */
    .wb-colors {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .wb-color {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .wb-color:hover {
      transform: scale(1.15);
    }

    .wb-color.active {
      border-color: white;
      box-shadow: 0 0 0 2px var(--wb-accent);
    }

    /* Stroke width */
    .wb-stroke-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wb-stroke {
      border: none;
      background: transparent;
      color: var(--wb-ink-soft);
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .wb-stroke:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .wb-stroke.active {
      background: var(--wb-accent-soft);
      color: var(--wb-accent);
    }

    /* Right actions */
    .wb-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wb-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .wb-btn-ghost {
      background: transparent;
      color: var(--wb-ink-soft);
    }

    .wb-btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--wb-ink);
    }

    .wb-btn-primary {
      background: var(--wb-accent);
      color: white;
    }

    .wb-btn-primary:hover {
      background: #2970d9;
    }

    /* Canvas area */
    .wb-canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .wb-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* Grid background */
    .wb-canvas-wrap::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(var(--wb-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--wb-grid) 1px, transparent 1px),
        linear-gradient(var(--wb-grid-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--wb-grid-strong) 1px, transparent 1px);
      background-size:
        20px 20px,
        20px 20px,
        100px 100px,
        100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    /* Text input overlay */
    .wb-text-input {
      position: absolute;
      background: transparent;
      border: 1px dashed var(--wb-accent);
      color: var(--wb-ink);
      font-family: var(--font);
      font-size: 16px;
      padding: 4px 8px;
      outline: none;
      z-index: 10;
      min-width: 100px;
    }

    /* Status bar */
    .wb-statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 20px;
      background: var(--wb-surface);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: var(--wb-ink-soft);
    }

    .wb-statusbar-left,
    .wb-statusbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .wb-zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .wb-zoom-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--wb-ink-soft);
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wb-zoom-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* Keyboard shortcut hints */
    .wb-hint {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--wb-surface);
      color: var(--wb-ink-soft);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 50;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .wb-hint.visible {
      opacity: 1;
    }

    .wb-hint kbd {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div class="wb-topbar">
    <div class="wb-brand">
      <div class="wb-brand-icon">T</div>
      <div>
        <div class="wb-brand-title">Teachy Whiteboard</div>
        <div class="wb-brand-sub">Draw, write, plan — freely</div>
      </div>
    </div>

    <!-- Tools -->
    <div class="wb-toolbar">
      <button class="wb-tool active" data-tool="select" title="Select (V)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      </button>
      <button class="wb-tool" data-tool="pen" title="Pen (P)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      </button>
      <button class="wb-tool" data-tool="line" title="Line (L)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      </button>
      <button class="wb-tool" data-tool="rect" title="Rectangle (R)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>
      <button class="wb-tool" data-tool="circle" title="Circle (C)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
      </button>
      <button class="wb-tool" data-tool="text" title="Text (T)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </button>

      <div class="wb-separator"></div>

      <!-- Colors -->
      <div class="wb-colors">
        <div class="wb-color active" data-color="#e8e8e8" style="background:#e8e8e8" title="White"></div>
        <div class="wb-color" data-color="#3380ff" style="background:#3380ff" title="Blue"></div>
        <div class="wb-color" data-color="#51cf66" style="background:#51cf66" title="Green"></div>
        <div class="wb-color" data-color="#ffd43b" style="background:#ffd43b" title="Yellow"></div>
        <div class="wb-color" data-color="#ff6b6b" style="background:#ff6b6b" title="Red"></div>
        <div class="wb-color" data-color="#cc5de8" style="background:#cc5de8" title="Purple"></div>
      </div>

      <div class="wb-separator"></div>

      <!-- Stroke width -->
      <div class="wb-stroke-group">
        <button class="wb-stroke active" data-stroke="2">Thin</button>
        <button class="wb-stroke" data-stroke="4">Medium</button>
        <button class="wb-stroke" data-stroke="8">Thick</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="wb-actions">
      <button class="wb-btn wb-btn-ghost" id="undo-btn" title="Undo (Ctrl+Z)">Undo</button>
      <button class="wb-btn wb-btn-ghost" id="clear-btn" title="Clear all">Clear</button>
      <button class="wb-btn wb-btn-primary" id="save-btn" title="Save as PNG">Save PNG</button>
    </div>
  </div>

  <!-- Canvas -->
  <div class="wb-canvas-wrap" id="canvas-wrap">
    <canvas class="wb-canvas" id="wb-canvas"></canvas>
  </div>

  <!-- Hint -->
  <div class="wb-hint" id="hint">
    <kbd>V</kbd> Select &nbsp; <kbd>P</kbd> Pen &nbsp; <kbd>L</kbd> Line &nbsp;
    <kbd>R</kbd> Rect &nbsp; <kbd>C</kbd> Circle &nbsp; <kbd>T</kbd> Text &nbsp;
    <kbd>Ctrl+Z</kbd> Undo &nbsp; <kbd>Del</kbd> Delete
  </div>

  <!-- Status bar -->
  <div class="wb-statusbar">
    <div class="wb-statusbar-left">
      <span id="tool-label">Select</span>
      <span id="object-count">0 objects</span>
    </div>
    <div class="wb-statusbar-right">
      <div class="wb-zoom-controls">
        <button class="wb-zoom-btn" id="zoom-out" title="Zoom out">−</button>
        <span id="zoom-level">100%</span>
        <button class="wb-zoom-btn" id="zoom-in" title="Zoom in">+</button>
        <button class="wb-zoom-btn" id="zoom-fit" title="Fit to screen">⊡</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wb-canvas');
    const ctx = canvas.getContext('2d');
    const canvasWrap = document.getElementById('canvas-wrap');

    // State
    let currentTool = 'select';
    let currentColor = '#e8e8e8';
    let currentStroke = 2;
    let zoom = 1;
    let panX = 0, panY = 0;
    let objects = [];
    let undoStack = [];
    let selectedObject = null;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentPath = [];
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let hintTimeout;

    function resizeCanvas() {
      const rect = canvasWrap.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      render();
    }

    function render() {
      const rect = canvasWrap.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(zoom, zoom);

      for (const obj of objects) {
        drawObject(obj);
      }

      if (isDrawing && currentTool === 'pen' && currentPath.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentStroke;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) {
          ctx.lineTo(currentPath[i].x, currentPath[i].y);
        }
        ctx.stroke();
      }

      if (isDrawing && currentTool === 'line') {
        ctx.beginPath();
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentStroke;
        ctx.lineCap = 'round';
        ctx.moveTo(startX, startY);
        ctx.lineTo((startX + panX) / zoom - panX / zoom + panX, startY);
        ctx.stroke();
      }

      ctx.restore();
      updateObjectCount();
    }

    function drawObject(obj) {
      ctx.save();
      ctx.strokeStyle = obj.color;
      ctx.fillStyle = obj.color;
      ctx.lineWidth = obj.stroke;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      switch (obj.type) {
        case 'pen':
          if (obj.points.length < 2) break;
          ctx.beginPath();
          ctx.moveTo(obj.points[0].x, obj.points[0].y);
          for (let i = 1; i < obj.points.length; i++) {
            ctx.lineTo(obj.points[i].x, obj.points[i].y);
          }
          ctx.stroke();
          break;
        case 'line':
          ctx.beginPath();
          ctx.moveTo(obj.x1, obj.y1);
          ctx.lineTo(obj.x2, obj.y2);
          ctx.stroke();
          break;
        case 'rect':
          ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
          break;
        case 'circle':
          ctx.beginPath();
          ctx.ellipse(obj.cx, obj.cy, Math.abs(obj.rx), Math.abs(obj.ry), 0, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case 'text':
          ctx.font = `${obj.fontSize}px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif`;
          ctx.fillText(obj.text, obj.x, obj.y);
          break;
      }

      if (obj === selectedObject) {
        const bounds = getObjectBounds(obj);
        ctx.strokeStyle = '#3380ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(bounds.x - 4, bounds.y - 4, bounds.w + 8, bounds.h + 8);
        ctx.setLineDash([]);
      }

      ctx.restore();
    }

    function getObjectBounds(obj) {
      switch (obj.type) {
        case 'pen': {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          for (const p of obj.points) {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
            maxY = Math.max(maxY, p.y);
          }
          return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }
        case 'line': {
          const x = Math.min(obj.x1, obj.x2);
          const y = Math.min(obj.y1, obj.y2);
          return { x, y, w: Math.abs(obj.x2 - obj.x1), h: Math.abs(obj.y2 - obj.y1) };
        }
        case 'rect':
          return { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
        case 'circle':
          return { x: obj.cx - Math.abs(obj.rx), y: obj.cy - Math.abs(obj.ry), w: Math.abs(obj.rx) * 2, h: Math.abs(obj.ry) * 2 };
        case 'text':
          return { x: obj.x, y: obj.y - obj.fontSize, w: obj.text.length * obj.fontSize * 0.6, h: obj.fontSize };
      }
      return { x: 0, y: 0, w: 0, h: 0 };
    }

    function toCanvasCoords(e) {
      const rect = canvasWrap.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left - panX) / zoom,
        y: (e.clientY - rect.top - panY) / zoom
      };
    }

    function hitTest(x, y) {
      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];
        const b = getObjectBounds(obj);
        if (x >= b.x - 8 && x <= b.x + b.w + 8 && y >= b.y - 8 && y <= b.y + b.h + 8) {
          return obj;
        }
      }
      return null;
    }

    function saveState() {
      undoStack.push(JSON.parse(JSON.stringify(objects)));
      if (undoStack.length > 50) undoStack.shift();
    }

    function undo() {
      if (undoStack.length === 0) return;
      objects = undoStack.pop();
      selectedObject = null;
      render();
    }

    function clearAll() {
      if (objects.length === 0) return;
      saveState();
      objects = [];
      selectedObject = null;
      render();
    }

    function updateToolLabel() {
      const labels = { select: 'Select', pen: 'Pen', line: 'Line', rect: 'Rectangle', circle: 'Circle', text: 'Text' };
      document.getElementById('tool-label').textContent = labels[currentTool] || currentTool;
    }

    function updateObjectCount() {
      document.getElementById('object-count').textContent = `${objects.length} object${objects.length !== 1 ? 's' : ''}`;
    }

    function showHint(text) {
      const hint = document.getElementById('hint');
      hint.innerHTML = text;
      hint.classList.add('visible');
      clearTimeout(hintTimeout);
      hintTimeout = setTimeout(() => hint.classList.remove('visible'), 3000);
    }

    // Event handlers
    canvas.addEventListener('mousedown', (e) => {
      const pos = toCanvasCoords(e);

      if (e.button === 1 || (e.button === 0 && e.altKey)) {
        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
        canvas.style.cursor = 'grabbing';
        return;
      }

      if (currentTool === 'select') {
        selectedObject = hitTest(pos.x, pos.y);
        render();
        return;
      }

      if (currentTool === 'text') {
        const input = document.createElement('input');
        input.className = 'wb-text-input';
        input.style.left = (pos.x * zoom + panX) + 'px';
        input.style.top = (pos.y * zoom + panY) + 'px';
        input.style.fontSize = (16 * zoom) + 'px';
        canvasWrap.appendChild(input);
        input.focus();
        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') {
            const text = input.value.trim();
            if (text) {
              saveState();
              objects.push({ type: 'text', x: pos.x, y: pos.y, text, color: currentColor, fontSize: 16 });
              render();
            }
            input.remove();
          } else if (ev.key === 'Escape') {
            input.remove();
          }
        });
        input.addEventListener('blur', () => {
          const text = input.value.trim();
          if (text) {
            saveState();
            objects.push({ type: 'text', x: pos.x, y: pos.y, text, color: currentColor, fontSize: 16 });
            render();
          }
          input.remove();
        });
        return;
      }

      isDrawing = true;
      startX = pos.x;
      startY = pos.y;
      currentPath = [{ x: pos.x, y: pos.y }];
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        render();
        return;
      }

      if (!isDrawing) return;
      const pos = toCanvasCoords(e);

      if (currentTool === 'pen') {
        currentPath.push({ x: pos.x, y: pos.y });
        render();
      } else if (currentTool === 'line' || currentTool === 'rect' || currentTool === 'circle') {
        render();
        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(zoom, zoom);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentStroke;
        ctx.lineCap = 'round';

        if (currentTool === 'line') {
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        } else if (currentTool === 'rect') {
          ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
        } else if (currentTool === 'circle') {
          ctx.beginPath();
          const rx = Math.abs(pos.x - startX) / 2;
          const ry = Math.abs(pos.y - startY) / 2;
          const cx = (startX + pos.x) / 2;
          const cy = (startY + pos.y) / 2;
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = currentTool === 'select' ? 'default' : 'crosshair';
        return;
      }

      if (!isDrawing) return;
      isDrawing = false;
      const pos = toCanvasCoords(e);

      saveState();

      if (currentTool === 'pen' && currentPath.length > 1) {
        objects.push({ type: 'pen', points: [...currentPath], color: currentColor, stroke: currentStroke });
      } else if (currentTool === 'line') {
        objects.push({ type: 'line', x1: startX, y1: startY, x2: pos.x, y2: pos.y, color: currentColor, stroke: currentStroke });
      } else if (currentTool === 'rect') {
        objects.push({ type: 'rect', x: startX, y: startY, w: pos.x - startX, h: pos.y - startY, color: currentColor, stroke: currentStroke });
      } else if (currentTool === 'circle') {
        const rx = Math.abs(pos.x - startX) / 2;
        const ry = Math.abs(pos.y - startY) / 2;
        objects.push({ type: 'circle', cx: (startX + pos.x) / 2, cy: (startY + pos.y) / 2, rx, ry, color: currentColor, stroke: currentStroke });
      }

      currentPath = [];
      render();
    });

    canvas.addEventListener('dblclick', (e) => {
      if (currentTool !== 'select') return;
      const pos = toCanvasCoords(e);
      const hit = hitTest(pos.x, pos.y);
      if (hit) {
        selectedObject = hit;
        render();
      }
    });

    // Tool selection
    document.querySelectorAll('.wb-tool').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTool = btn.dataset.tool;
        document.querySelectorAll('.wb-tool').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        canvas.style.cursor = currentTool === 'select' ? 'default' : 'crosshair';
        updateToolLabel();
      });
    });

    // Color selection
    document.querySelectorAll('.wb-color').forEach(el => {
      el.addEventListener('click', () => {
        currentColor = el.dataset.color;
        document.querySelectorAll('.wb-color').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
      });
    });

    // Stroke selection
    document.querySelectorAll('.wb-stroke').forEach(btn => {
      btn.addEventListener('click', () => {
        currentStroke = parseInt(btn.dataset.stroke);
        document.querySelectorAll('.wb-stroke').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Zoom
    document.getElementById('zoom-in').addEventListener('click', () => {
      zoom = Math.min(zoom * 1.2, 5);
      document.getElementById('zoom-level').textContent = Math.round(zoom * 100) + '%';
      render();
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      zoom = Math.max(zoom / 1.2, 0.1);
      document.getElementById('zoom-level').textContent = Math.round(zoom * 100) + '%';
      render();
    });

    document.getElementById('zoom-fit').addEventListener('click', () => {
      zoom = 1;
      panX = 0;
      panY = 0;
      document.getElementById('zoom-level').textContent = '100%';
      render();
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvasWrap.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      const newZoom = Math.max(0.1, Math.min(5, zoom * delta));
      panX = mx - (mx - panX) * (newZoom / zoom);
      panY = my - (my - panY) * (newZoom / zoom);
      zoom = newZoom;
      document.getElementById('zoom-level').textContent = Math.round(zoom * 100) + '%';
      render();
    }, { passive: false });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;

      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        undo();
        return;
      }

      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedObject) {
          saveState();
          objects = objects.filter(o => o !== selectedObject);
          selectedObject = null;
          render();
        }
        return;
      }

      const toolMap = { v: 'select', p: 'pen', l: 'line', r: 'rect', c: 'circle', t: 'text' };
      if (toolMap[e.key.toLowerCase()] && !e.ctrlKey && !e.metaKey) {
        currentTool = toolMap[e.key.toLowerCase()];
        document.querySelectorAll('.wb-tool').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-tool="${currentTool}"]`).classList.add('active');
        canvas.style.cursor = currentTool === 'select' ? 'default' : 'crosshair';
        updateToolLabel();
      }
    });

    // Buttons
    document.getElementById('undo-btn').addEventListener('click', undo);
    document.getElementById('clear-btn').addEventListener('click', clearAll);
    document.getElementById('save-btn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'teachy-whiteboard.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Init
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    updateToolLabel();

    // Show hint on load
    setTimeout(() => {
      showHint('Press <kbd>V</kbd> Select &nbsp; <kbd>P</kbd> Pen &nbsp; <kbd>R</kbd> Rect &nbsp; <kbd>T</kbd> Text &nbsp; Scroll to zoom &nbsp; Alt+drag to pan');
    }, 500);
  </script>
</body>
</html>
