<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teachy hero demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teachy: #3380ff;
      --teachy-glow: rgba(51, 128, 255, 0.45);
      --ink: #1b1a2e;
      --muted: #6b6478;
      --loop: 15s;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 55% 45% at 15% 10%, rgba(51, 128, 255, 0.16), transparent 60%),
        radial-gradient(ellipse 45% 40% at 90% 80%, rgba(255, 170, 90, 0.12), transparent 55%),
        #e8eef6;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
    }

    .menubar {
      position: absolute;
      inset: 0 0 auto;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(27, 26, 46, 0.7);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      z-index: 2;
    }

    .menubar-left { display: flex; gap: 14px; align-items: center; }
    .apple {
      width: 11px; height: 11px; border-radius: 3px;
      background: var(--ink); opacity: 0.75;
    }

    /* Fake ChatGPT window — Teachy coaches on top of a real app */
    .window {
      position: absolute;
      left: 140px;
      top: 62px;
      width: 1000px;
      height: 580px;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(27, 26, 46, 0.08);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.85) inset,
        0 30px 80px rgba(27, 26, 46, 0.18);
    }

    .chrome {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: linear-gradient(180deg, #fbfcfe, #eef1f5);
      border-bottom: 1px solid #e6e9ef;
    }

    .chrome i {
      width: 12px; height: 12px; border-radius: 50%; display: block;
    }
    .chrome i:nth-child(1) { background: #ff5f57; }
    .chrome i:nth-child(2) { background: #febc2e; }
    .chrome i:nth-child(3) { background: #28c840; }

    .url {
      flex: 1;
      margin: 0 18px 0 8px;
      height: 28px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e2e6ee;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 500;
    }

    .url::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
    }

    .chat {
      position: relative;
      height: calc(100% - 44px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #f7f7f8;
    }

    .chat-head {
      padding: 14px 22px;
      background: #fff;
      border-bottom: 1px solid #eceef2;
      font-weight: 650;
      font-size: 14px;
      color: #444;
    }

    .thread {
      padding: 28px 72px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
    }

    .bubble {
      max-width: 70%;
      padding: 14px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 500;
    }

    .bubble.user {
      align-self: flex-end;
      background: #ebeff5;
      color: var(--ink);
    }

    .bubble.bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e7e9ee;
      color: #333;
      box-shadow: 0 6px 18px rgba(27, 26, 46, 0.04);
    }

    .composer {
      position: relative;
      margin: 0 48px 28px;
      background: #fff;
      border: 1.5px solid #d9dee8;
      border-radius: 18px;
      min-height: 92px;
      padding: 14px 56px 14px 16px;
      box-shadow: 0 10px 28px rgba(27, 26, 46, 0.05);
    }

    .composer .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9aa0ad;
      margin-bottom: 8px;
    }

    .composer .text {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
    }

    .composer .text.placeholder { color: #a3a9b6; }

    .send {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #d0d5df;
      display: grid;
      place-items: center;
    }

    .send svg { width: 16px; height: 16px; fill: #fff; }

    .chalk {
      position: absolute;
      inset: -7px;
      border-radius: 22px;
      border: 2.5px solid rgba(51, 128, 255, 0.9);
      box-shadow: 0 0 0 6px rgba(51, 128, 255, 0.14);
      opacity: 0;
      pointer-events: none;
    }

    .send .chalk {
      border-radius: 50%;
      inset: -8px;
    }

    /* —— THE BUDDY (this is Teachy) —— */
    .buddy {
      position: absolute;
      z-index: 50;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
      filter: drop-shadow(0 14px 28px rgba(51, 128, 255, 0.35));
      will-change: transform;
    }

    .buddy-speech {
      background: var(--teachy);
      color: #fff;
      font-family: "Baloo 2", sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
      padding: 11px 14px;
      border-radius: 16px 16px 16px 5px;
      max-width: 260px;
      box-shadow: 0 12px 30px rgba(51, 128, 255, 0.4);
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      white-space: nowrap;
    }

    .buddy-cursor {
      width: 34px;
      height: 34px;
      background: var(--teachy);
      clip-path: polygon(12% 8%, 92% 48%, 12% 92%);
      transform: rotate(-28deg);
      margin-left: 6px;
      filter: drop-shadow(0 8px 16px var(--teachy-glow));
    }

    .buddy-cursor.is-click {
      transform: rotate(-28deg) scale(0.82);
    }

    .hud {
      position: absolute;
      left: 50%;
      top: 34px;
      transform: translateX(-50%);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(27, 26, 46, 0.88);
      color: #fff;
      font-family: "Baloo 2", sans-serif;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(27, 26, 46, 0.25);
    }

    .hud i {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff4d5e;
      box-shadow: 0 0 0 4px rgba(255, 77, 94, 0.25);
      animation: pulse 1.2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(20px);
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--teachy);
      color: #fff;
      font-family: "Baloo 2", sans-serif;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 16px 40px rgba(51, 128, 255, 0.4);
      opacity: 0;
      pointer-events: none;
    }

    .toast b {
      width: 22px; height: 22px; border-radius: 50%;
      background: #fff; color: var(--teachy);
      display: grid; place-items: center;
      font-size: 13px;
    }

    /* Animations */
    .buddy { animation: buddy-path var(--loop) var(--ease) infinite; }
    .buddy-speech { animation: speech-swap var(--loop) var(--ease) infinite; }
    .buddy-cursor { animation: cursor-click var(--loop) var(--ease) infinite; }
    .composer .chalk { animation: chalk-box var(--loop) var(--ease) infinite; }
    .send .chalk { animation: chalk-send var(--loop) var(--ease) infinite; }
    .composer { animation: composer-focus var(--loop) var(--ease) infinite; }
    .send { animation: send-ready var(--loop) var(--ease) infinite; }
    .composer .text { animation: prompt-type var(--loop) steps(1, end) infinite; }
    .toast { animation: toast-in var(--loop) var(--ease) infinite; }
    .bubble.user.weak { animation: fade-weak var(--loop) var(--ease) infinite; }
    .bubble.user.strong { animation: show-strong var(--loop) var(--ease) infinite; }

    @keyframes buddy-path {
      /* start near center-right so poster frame shows Teachy immediately */
      0%, 6%   { transform: translate3d(620px, 220px, 0); }
      /* point at the weak prompt / composer */
      14%, 38% { transform: translate3d(520px, 430px, 0); }
      /* move to send */
      48%, 62% { transform: translate3d(860px, 500px, 0); }
      /* celebrate near toast */
      72%, 88% { transform: translate3d(560px, 480px, 0); }
      100%     { transform: translate3d(620px, 220px, 0); }
    }

    @keyframes speech-swap {
      0%, 8%   { opacity: 0; transform: translateY(8px) scale(0.96); }
      12%, 36% { opacity: 1; transform: none; }
      40%, 44% { opacity: 0; transform: translateY(-4px) scale(0.98); }
      48%, 60% { opacity: 1; transform: none; }
      64%, 68% { opacity: 0; transform: translateY(-4px) scale(0.98); }
      72%, 88% { opacity: 1; transform: none; }
      92%, 100%{ opacity: 0; transform: translateY(-4px) scale(0.98); }
    }

    /* text content via attr swaps on ::after — use multiple overlays instead */
    .buddy-speech::before {
      content: "hold on — that prompt is too vague";
      animation: line-a var(--loop) steps(1, end) infinite;
    }

    @keyframes line-a {
      0%, 40% { content: "hold on — that prompt is too vague"; }
      41%, 64% { content: "tap Send when it’s ready"; }
      65%, 100% { content: "nice — you did that. i checked."; }
    }

    @keyframes cursor-click {
      0%, 54% { transform: rotate(-28deg) scale(1); }
      56%, 58% { transform: rotate(-28deg) scale(0.8); }
      60%, 100% { transform: rotate(-28deg) scale(1); }
    }

    @keyframes chalk-box {
      0%, 12% { opacity: 0; }
      16%, 36% { opacity: 1; }
      42%, 100% { opacity: 0; }
    }

    @keyframes chalk-send {
      0%, 46% { opacity: 0; }
      50%, 60% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }

    @keyframes composer-focus {
      0%, 12% { border-color: #d9dee8; box-shadow: 0 10px 28px rgba(27, 26, 46, 0.05); }
      16%, 38% { border-color: var(--teachy); box-shadow: 0 0 0 5px rgba(51, 128, 255, 0.16), 0 10px 28px rgba(27, 26, 46, 0.05); }
      44%, 100% { border-color: #d9dee8; box-shadow: 0 10px 28px rgba(27, 26, 46, 0.05); }
    }

    @keyframes send-ready {
      0%, 46% { background: #d0d5df; }
      50%, 100% { background: var(--teachy); }
    }

    @keyframes prompt-type {
      0%, 18% {
        color: #a3a9b6;
      }
      19% { color: var(--ink); }
    }

    .composer .text::after {
      content: "Message ChatGPT";
      animation: typed var(--loop) steps(1, end) infinite;
    }

    @keyframes typed {
      0%, 18% { content: "Message ChatGPT"; color: #a3a9b6; }
      22% { content: "w"; }
      24% { content: "wr"; }
      26% { content: "write me a"; }
      30% { content: "write me a caption for"; }
      36%, 100% { content: "write a playful IG caption for teens who skate"; }
    }

    @keyframes fade-weak {
      0%, 20% { opacity: 1; }
      28%, 100% { opacity: 0.35; }
    }

    @keyframes show-strong {
      0%, 34% { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; overflow: hidden; }
      38%, 100% { opacity: 1; max-height: 80px; padding: 14px 16px; }
    }

    @keyframes toast-in {
      0%, 70% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      76%, 92% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="menubar" aria-hidden="true">
      <div class="menubar-left">
        <span class="apple"></span>
        <span>ChatGPT</span>
        <span>File</span>
        <span>Edit</span>
      </div>
      <span>Fri 5:42 PM</span>
    </div>

    <div class="hud"><i></i> teachy · coaching live</div>

    <div class="window">
      <div class="chrome">
        <i></i><i></i><i></i>
        <div class="url">chatgpt.com</div>
      </div>

      <div class="chat">
        <div class="chat-head">ChatGPT</div>
        <div class="thread">
          <div class="bubble user weak">write me a caption</div>
          <div class="bubble bot">Sure — here’s one: “Living my best life ✨” Want something more specific?</div>
          <div class="bubble user strong">write a playful IG caption for teens who skate</div>
        </div>

        <div class="composer" id="composer">
          <div class="label">prompt</div>
          <div class="text"></div>
          <button class="send" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M3.4 20.6L20.5 12 3.4 3.4l2.8 7.3L16 12l-9.8 1.3z"/></svg>
            <span class="chalk" aria-hidden="true"></span>
          </button>
          <span class="chalk" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <!-- Teachy buddy: blue speech + blue triangle cursor (matches the app) -->
    <div class="buddy" aria-hidden="true">
      <div class="buddy-speech"></div>
      <div class="buddy-cursor"></div>
    </div>

    <div class="toast"><b>✓</b> checked — better prompt, you wrote it</div>
  </div>

  <script>
    window.__TEACHY_HERO_DEMO__ = {
      width: 1280,
      height: 720,
      durationMs: 15000,
      ready: true
    };
  </script>
</body>
</html>
